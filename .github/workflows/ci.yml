name: ci

on:
  push:
  pull_request:

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y libmariadb-dev
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - run: python scripts/release/audit_repository.py
      - run: python -m compileall -q strategy.py src scripts tests
      - run: bash -n scripts/runtime/*.sh market_data_collector/*.sh
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release/build_handoff_artifact.py --output dist/ci-handoff.tar.xz
      - run: python scripts/release/verify_handoff_artifact.py dist/ci-handoff.tar.xz
